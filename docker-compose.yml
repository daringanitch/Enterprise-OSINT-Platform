services:
  # PostgreSQL Database
  postgresql:
    image: postgres:15.5-alpine
    container_name: osint-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: osint_audit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./simple-backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - osint-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Password Vault (daringanitch/password-vault)
  # AES-256-GCM encrypted secret store — replaces HashiCorp Vault for local dev.
  #
  # One-time setup:
  #   1. docker compose run --rm vault-cli init          # prints VAULT_MASTER_KEY
  #   2. export VAULT_MASTER_KEY=<key>; echo "VAULT_MASTER_KEY=<key>" >> .env
  #   3. docker compose up password-vault -d             # start the vault
  #   4. docker compose run --rm vault-cli secret add --key shodan_api_key --value <val>
  #      (repeat for each API key — see .env.template for full list)
  #   5. docker compose run --rm vault-cli token create --name osint-backend
  #      # prints VAULT_TOKEN — add to .env
  #   6. docker compose up -d                            # start everything
  password-vault:
    image: ghcr.io/daringanitch/password-vault:latest
    container_name: osint-password-vault
    environment:
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      VAULT_DB_PATH: /vault/data/vault.db
      VAULT_PORT: "8080"
    volumes:
      - vault_data:/vault/data
    networks:
      - osint-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Vault CLI — for admin operations only (not started by default)
  # Usage: docker compose run --rm vault-cli <command>
  # Examples:
  #   docker compose run --rm vault-cli secret add --key openai_api_key --value sk-...
  #   docker compose run --rm vault-cli token create --name osint-backend
  #   docker compose run --rm vault-cli token list
  vault-cli:
    image: ghcr.io/daringanitch/password-vault:latest
    entrypoint: ["/bin/vault-cli"]
    environment:
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      VAULT_DB_PATH: /vault/data/vault.db
    volumes:
      - vault_data:/vault/data
    networks:
      - osint-network
    profiles:
      - tools

  # OSINT Backend
  backend:
    build:
      context: ./simple-backend
      dockerfile: Dockerfile
    container_name: osint-backend
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: osint_audit
      VAULT_URL: http://password-vault:8080
      VAULT_TOKEN: ${VAULT_TOKEN}
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_DATA_DIR: /data                 # writable dir outside the :ro source mount
      OPERATION_MODE: production          # serve real investigations, not demo data
    ports:
      - "5001:5001"
    depends_on:
      postgresql:
        condition: service_healthy
      password-vault:
        condition: service_healthy
    networks:
      - osint-network
    volumes:
      - ./simple-backend:/app:ro          # source code read-only
      - backend_data:/data                # writable runtime data/config at /data
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5001 --workers 1 --threads 4 --timeout 300 --access-logfile - --error-logfile - app:app

  # RQ Worker — processes investigation jobs queued by the backend
  worker:
    build:
      context: ./simple-backend
      dockerfile: Dockerfile
    container_name: osint-worker
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: osint_audit
      VAULT_URL: http://password-vault:8080
      VAULT_TOKEN: ${VAULT_TOKEN}
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_DATA_DIR: /data
      OPERATION_MODE: production          # must match backend mode
    depends_on:
      postgresql:
        condition: service_healthy
      password-vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osint-network
    volumes:
      - ./simple-backend:/app:ro
      - backend_data:/data
    restart: unless-stopped
    command: >
      rq worker investigations reports mcp_operations compliance default
      --url redis://redis:6379/0
      --with-scheduler

  # OSINT Frontend
  frontend:
    image: nginx:alpine
    container_name: osint-frontend
    volumes:
      - ./simple-frontend:/usr/share/nginx/html:ro
      - ./simple-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - osint-network

  # Redis Cache (optional, for future scaling)
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    ports:
      - "6379:6379"
    networks:
      - osint-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  osint-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  backend_data:
    driver: local