# ============================================================================
# Enterprise OSINT Platform - Demo Mode
# ============================================================================
# Standalone compose file for local demo/dev — no .env file required.
#
# Usage:
#   docker compose -f docker-compose.demo.yml up -d        # start everything
#   docker compose -f docker-compose.demo.yml up -d worker # start only worker
#   docker compose -f docker-compose.demo.yml logs -f      # tail logs
#   docker compose -f docker-compose.demo.yml down -v      # stop + remove volumes
#
#   # Or via Make:
#   make demo          # start all demo services
#   make demo-worker   # start worker only
#   make demo-down     # stop
#   make demo-logs     # tail logs
#
# DO NOT use for production — credentials are intentionally hardcoded.
#
# Access:
#   Frontend: http://localhost:8080   Login: admin / admin123
#   API:      http://localhost:5001
# ============================================================================

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:15.5-alpine
    container_name: osint-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_password_123
      POSTGRES_DB: osint_audit
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      # Run schema DDL on first boot (no-op on subsequent starts)
      - ./simple-backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - osint-demo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    networks:
      - osint-demo-network
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # OSINT Backend - Demo Mode
  osint-backend:
    build:
      context: ./simple-backend
      dockerfile: Dockerfile
    container_name: osint-backend
    environment:
      # Database
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_password_123
      POSTGRES_DB: osint_audit
      # Mode Configuration
      PLATFORM_MODE: demo
      DEMO_MODE: "true"
      # Security
      JWT_SECRET_KEY: demo-secret-key-not-for-production
      FLASK_ENV: production
      # Disable Vault for demo
      VAULT_ENABLED: "false"
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Logging
      LOG_LEVEL: INFO
    ports:
      - "5001:5001"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osint-demo-network
    # Override CMD: use gunicorn eventlet worker (required by flask-socketio).
    # Without -k eventlet, the gthread default worker conflicts with eventlet's
    # async I/O model and gunicorn may hang before binding port 5001.
    command: >
      gunicorn --bind 0.0.0.0:5001
               --worker-class eventlet
               --workers 1
               --timeout 300
               --access-logfile -
               --error-logfile -
               app:app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Eventlet worker startup + all blueprint imports can take up to 60 s
      # on a cold Docker build; give it plenty of runway before failing.
      start_period: 60s
    restart: unless-stopped

  # RQ Worker — processes investigation jobs queued by the backend
  worker:
    build:
      context: ./simple-backend
      dockerfile: Dockerfile
    container_name: osint-worker
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_password_123
      POSTGRES_DB: osint_audit
      PLATFORM_MODE: demo
      DEMO_MODE: "true"
      JWT_SECRET_KEY: demo-secret-key-not-for-production
      VAULT_TOKEN: ""
      VAULT_URL: ""
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osint-demo-network
    # The Dockerfile HEALTHCHECK hits http://localhost:5001/health, which only
    # exists in the backend container (gunicorn).  The worker runs rq, not
    # gunicorn, so port 5001 is never opened here — disable the health check
    # so Docker doesn't report the worker as perpetually unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped
    command: >
      rq worker investigations reports mcp_operations compliance default
        --url redis://redis:6379/0
        --with-scheduler

  # OSINT Frontend (Original with full functionality)
  osint-frontend:
    image: nginx:alpine
    container_name: osint-frontend
    volumes:
      - ./simple-frontend:/usr/share/nginx/html:ro
      - ./simple-frontend/nginx-demo.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      osint-backend:
        condition: service_healthy
    networks:
      - osint-demo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health.html"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  osint-demo-network:
    driver: bridge

volumes:
  demo_postgres_data:
    driver: local
  demo_redis_data:
    driver: local
