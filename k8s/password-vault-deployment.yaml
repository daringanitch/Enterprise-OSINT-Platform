---
# Password Vault — daringanitch/password-vault
# AES-256-GCM encrypted secret store for OSINT Platform API keys.
# Replaces HashiCorp Vault with a lightweight, dependency-free alternative.
#
# Setup after deploying:
#   # 1. Generate master key (run once)
#   kubectl run vault-init --rm -it --restart=Never -n osint-platform \
#     --image=ghcr.io/daringanitch/password-vault:latest \
#     --overrides='{"spec":{"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"password-vault-data"}}],"containers":[{"name":"vault-init","image":"ghcr.io/daringanitch/password-vault:latest","command":["/bin/vault-cli","init"],"env":[{"name":"VAULT_DB_PATH","value":"/vault/data/vault.db"}],"volumeMounts":[{"name":"data","mountPath":"/vault/data"}]}]}}'
#   # → prints VAULT_MASTER_KEY — store in your secrets manager
#
#   # 2. Populate the K8s secret with the real keys
#   kubectl create secret generic password-vault-secret -n osint-platform \
#     --from-literal=vault-master-key=<VAULT_MASTER_KEY> \
#     --from-literal=osint-backend-token=<VAULT_TOKEN>
#
#   # 3. Add API keys (example)
#   kubectl run vault-seed --rm -it --restart=Never -n osint-platform \
#     --image=ghcr.io/daringanitch/password-vault:latest \
#     --env="VAULT_MASTER_KEY=<key>" --env="VAULT_DB_PATH=/vault/data/vault.db" \
#     -- /bin/vault-cli secret add --key openai_api_key --value <val>

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: password-vault-data
  namespace: osint-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Secret — REPLACE placeholder values before any non-local deployment.
# Use an external secrets operator (Vault, AWS Secrets Manager, etc.) in production.
apiVersion: v1
kind: Secret
metadata:
  name: password-vault-secret
  namespace: osint-platform
  annotations:
    # PLACEHOLDER — replace vault-master-key and osint-backend-token
    # before deploying to any environment beyond local dev.
type: Opaque
stringData:
  vault-master-key: "REPLACE_WITH_VAULT_MASTER_KEY"
  osint-backend-token: "REPLACE_WITH_VAULT_TOKEN"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-vault
  namespace: osint-platform
  labels:
    app: password-vault
    component: secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: password-vault
  template:
    metadata:
      labels:
        app: password-vault
        component: secrets
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: password-vault
        image: ghcr.io/daringanitch/password-vault:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VAULT_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: password-vault-secret
              key: vault-master-key
        - name: VAULT_DB_PATH
          value: /vault/data/vault.db
        - name: VAULT_PORT
          value: "8080"
        - name: VAULT_RATE_LIMIT
          value: "20"
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: vault-data
        persistentVolumeClaim:
          claimName: password-vault-data

---
apiVersion: v1
kind: Service
metadata:
  name: password-vault
  namespace: osint-platform
  labels:
    app: password-vault
spec:
  selector:
    app: password-vault
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
