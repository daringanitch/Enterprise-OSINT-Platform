apiVersion: v1
kind: Secret
metadata:
  name: osint-api-keys
  namespace: osint-platform
  annotations:
    # API keys are managed by the password-vault service (k8s/password-vault-deployment.yaml).
    # The backend fetches them at startup via PasswordVaultClient.load_secrets_to_env().
    # These K8s Secret entries are optional fallbacks — the vault is the primary store.
    # Populate with: kubectl create secret generic osint-api-keys -n osint-platform \
    #   --from-literal=OPENAI_API_KEY=sk-... --from-literal=SHODAN_API_KEY=...
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  TWITTER_BEARER_TOKEN: ""
  SHODAN_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  REDDIT_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: osint-secrets
  namespace: osint-platform
  annotations:
    # IMPORTANT: Replace ALL placeholder values before any non-local deployment.
    # Recommended: use an External Secrets Operator with AWS Secrets Manager, GCP Secret Manager,
    # or HashiCorp Vault to inject these at deploy time rather than storing them here.
    #
    # Generate jwt-secret-key: python3 -c "import secrets; print(secrets.token_hex(32))"
    # Generate postgres-password: use your secrets manager or a strong random password
    # vault-token: generated by password-vault — see k8s/password-vault-deployment.yaml
type: Opaque
stringData:
  jwt-secret-key: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  postgres-user: "postgres"
  postgres-password: "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
  vault-token: "REPLACE_WITH_VAULT_TOKEN_FROM_PASSWORD_VAULT"
